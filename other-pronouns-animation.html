<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>one another the other the others 短動畫</title>
  <style>
    :root {
      --navy: #17324d;
      --ink: #1d2733;
      --muted: #667482;
      --line: #a7b4c0;
      --pale: #f5f8fa;
      --blue-pale: #ddeff6;
      --blue: #4f9db8;
      --orange-pale: #fff0d9;
      --orange: #e79a3b;
      --coral: #d95d55;
      --white: #fff;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #eef3f6; color: var(--ink); }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 18px;
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
    }

    .lesson {
      width: min(1040px, 100%);
      aspect-ratio: 16 / 9;
      min-height: 520px;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: var(--white);
      box-shadow: 0 24px 70px rgba(23, 50, 77, .16);
      padding: clamp(22px, 4vw, 52px);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 12px;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(28px, 4.4vw, 55px);
      line-height: 1.1;
      font-weight: 800;
      text-align: center;
      letter-spacing: .01em;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: clamp(15px, 2.1vw, 24px);
      text-align: center;
      min-height: 1.5em;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 280px;
      padding: 42px 24px 68px;
      border: 3px solid #c9d4dc;
      border-radius: 28px;
      background: linear-gradient(180deg, #ffffff 0%, var(--pale) 100%);
    }

    .tokens-wrap { position: relative; width: min(820px, 94%); }
    .tokens {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: clamp(18px, 4vw, 48px);
    }

    .token {
      width: clamp(62px, 8.5vw, 92px);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
      border: 5px solid var(--navy);
      border-radius: 50%;
      background: var(--white);
      color: var(--navy);
      font: 800 clamp(24px, 4vw, 42px)/1 Arial, sans-serif;
      opacity: 1;
      transform: scale(1);
      transition: opacity .45s ease, transform .45s ease, background .45s ease;
    }

    .token.hidden { display: none; }
    .token.dim { opacity: .34; transform: scale(.93); }
    .token.one { background: var(--coral); color: var(--white); }
    .token.another { background: var(--orange); }
    .token.other, .token.others { background: var(--blue); color: var(--white); }

    .token::after {
      content: "";
      position: absolute;
      inset: -15px;
      border: 6px solid currentColor;
      border-radius: 50%;
      opacity: 0;
      transform: scale(.65) rotate(-8deg);
    }

    .token.ring-one::after { color: var(--coral); animation: circle-in .65s ease forwards; }
    .token.ring-another::after { color: var(--orange); animation: circle-in .65s ease forwards; }
    .token.ring-other::after { color: var(--blue); animation: circle-in .65s ease forwards; }

    @keyframes circle-in {
      0% { opacity: 0; transform: scale(.55) rotate(-8deg); }
      75% { opacity: 1; transform: scale(1.08) rotate(4deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    .group-focus {
      position: absolute;
      z-index: 1;
      left: 17%;
      right: 0;
      top: -24px;
      bottom: -28px;
      border: 7px solid var(--blue);
      border-radius: 32px;
      opacity: 0;
      transform: scaleX(.15);
      transform-origin: right center;
      transition: opacity .35s ease, transform .8s cubic-bezier(.2,.8,.2,1);
    }
    .group-focus.show { opacity: 1; transform: scaleX(1); }
    .group-focus.last-four { left: 32%; }

    .labels {
      min-height: 58px;
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 34px;
      position: relative;
      z-index: 3;
    }
    .label {
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 10px 22px;
      border-radius: 999px;
      color: var(--navy);
      font-size: clamp(19px, 2.7vw, 31px);
      font-weight: 800;
      opacity: 0;
      transform: translateY(18px);
    }
    .label.show { display: flex; animation: label-in .5s ease forwards; }
    .label.one-label, .label.another-label { background: var(--orange-pale); }
    .label.other-label, .label.others-label { background: var(--blue-pale); }
    @keyframes label-in { to { opacity: 1; transform: translateY(0); } }

    .equation {
      min-height: 36px;
      text-align: center;
      color: var(--navy);
      font-size: clamp(18px, 2.5vw, 29px);
      font-weight: 800;
      opacity: 0;
      transition: opacity .45s ease;
    }
    .equation.show { opacity: 1; }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 24px;
      background: var(--navy);
      color: var(--white);
      font: 700 18px/1 "Microsoft JhengHei", sans-serif;
      cursor: pointer;
    }
    button.secondary { background: #dce5eb; color: var(--navy); }
    button:disabled { opacity: .45; cursor: default; }

    .progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 7px;
      background: #e6edf1;
    }
    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--coral), var(--orange), var(--blue));
    }
    .lesson.playing .progress > span { animation: progress 22s linear forwards; }
    @keyframes progress { to { width: 100%; } }

    @media (max-width: 680px) {
      body { padding: 0; background: var(--white); }
      .lesson { min-height: 100vh; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
      .stage { min-height: 360px; padding-inline: 12px; }
      .tokens { gap: 14px; }
      .token { width: 54px; border-width: 4px; }
      .token::after { inset: -10px; border-width: 4px; }
      .group-focus { border-width: 5px; }
      .label { min-width: 130px; padding-inline: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main id="lesson" class="lesson" aria-live="polite">
    <h1 id="title">one 和其他代名詞</h1>
    <p id="lead" class="lead">按下播放，觀察「剩下一個」和「剩下全部」的差別。</p>

    <section class="stage" aria-label="代名詞概念動畫">
      <div class="tokens-wrap">
        <div id="groupFocus" class="group-focus" aria-hidden="true"></div>
        <div id="tokens" class="tokens"></div>
        <div class="labels">
          <div id="oneLabel" class="label one-label">one　一個</div>
          <div id="anotherLabel" class="label another-label">another　另一個</div>
          <div id="otherLabel" class="label other-label">the other　剩下那一個</div>
          <div id="othersLabel" class="label others-label">the others　剩下的那些</div>
        </div>
      </div>
      <div id="equation" class="equation"></div>
    </section>

    <div class="controls">
      <button id="playButton" type="button">播放動畫</button>
      <button id="soundButton" class="secondary" type="button" aria-pressed="true">聲音：開</button>
    </div>
    <div class="progress" aria-hidden="true"><span></span></div>
  </main>

  <script>
    const lesson = document.getElementById('lesson');
    const tokensEl = document.getElementById('tokens');
    const titleEl = document.getElementById('title');
    const leadEl = document.getElementById('lead');
    const equationEl = document.getElementById('equation');
    const groupFocus = document.getElementById('groupFocus');
    const playButton = document.getElementById('playButton');
    const soundButton = document.getElementById('soundButton');
    const labels = {
      one: document.getElementById('oneLabel'),
      another: document.getElementById('anotherLabel'),
      other: document.getElementById('otherLabel'),
      others: document.getElementById('othersLabel')
    };

    let playing = false;
    let soundOn = true;
    let runId = 0;

    for (let i = 1; i <= 6; i += 1) {
      const token = document.createElement('div');
      token.className = 'token';
      token.dataset.index = String(i);
      token.textContent = String(i);
      tokensEl.appendChild(token);
    }

    const tokens = [...document.querySelectorAll('.token')];
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    function speak(text) {
      if (!soundOn || !('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.82;
      utterance.pitch = 1;
      const voice = speechSynthesis.getVoices().find(v => /^en(-|_)/i.test(v.lang));
      if (voice) utterance.voice = voice;
      speechSynthesis.speak(utterance);
    }

    function resetVisual(count = 6) {
      tokens.forEach((token, index) => {
        token.className = 'token';
        token.classList.toggle('hidden', index >= count);
      });
      Object.values(labels).forEach(label => label.classList.remove('show'));
      groupFocus.className = 'group-focus';
      equationEl.classList.remove('show');
      equationEl.textContent = '';
    }

    function showLabel(name) {
      Object.values(labels).forEach(label => label.classList.remove('show'));
      labels[name].classList.add('show');
    }

    function highlightOne(index, kind) {
      const token = tokens[index];
      token.classList.remove('dim');
      token.classList.add(kind, `ring-${kind === 'other' ? 'other' : kind}`);
      tokens.forEach((item, i) => {
        if (i !== index && !item.classList.contains('hidden')) item.classList.add('dim');
      });
      showLabel(kind);
      speak(kind === 'other' ? 'the other' : kind);
    }

    function highlightGroup(startIndex, labelName, lastFour = false) {
      tokens.forEach((token, index) => {
        if (token.classList.contains('hidden')) return;
        token.classList.toggle('dim', index < startIndex);
        if (index >= startIndex) token.classList.add('others');
      });
      groupFocus.className = `group-focus show${lastFour ? ' last-four' : ''}`;
      showLabel(labelName);
      speak('the others');
    }

    async function play() {
      if (playing) return;
      playing = true;
      runId += 1;
      const thisRun = runId;
      playButton.disabled = true;
      playButton.textContent = '播放中';
      lesson.classList.remove('playing');
      void lesson.offsetWidth;
      lesson.classList.add('playing');
      if ('speechSynthesis' in window) speechSynthesis.cancel();

      resetVisual(6);
      titleEl.textContent = '已知的一整群：one → the others';
      leadEl.textContent = '先指出其中一個，再指出已知範圍內剩下的全部。';
      await wait(950);
      if (thisRun !== runId) return;
      highlightOne(0, 'one');
      await wait(2100);
      if (thisRun !== runId) return;
      highlightGroup(1, 'others');
      await wait(2200);
      equationEl.textContent = 'one + the others = 這一整群的全部';
      equationEl.classList.add('show');
      await wait(2500);

      resetVisual(2);
      titleEl.textContent = '只有兩個：one → the other';
      leadEl.textContent = '只剩唯一的一個，所以 other 用單數。';
      await wait(800);
      highlightOne(0, 'one');
      await wait(1700);
      tokens[0].classList.add('dim');
      tokens[1].classList.remove('dim');
      highlightOne(1, 'other');
      await wait(1900);
      equationEl.textContent = 'one + the other = 兩個全部';
      equationEl.classList.add('show');
      await wait(2300);

      resetVisual(6);
      titleEl.textContent = '三個以上逐一選取';
      leadEl.textContent = '一個、另一個，最後才是剩下的那些。';
      await wait(700);
      highlightOne(0, 'one');
      await wait(1500);
      tokens.forEach(token => token.classList.remove('dim'));
      highlightOne(1, 'another');
      await wait(1700);
      highlightGroup(2, 'others', true);
      await wait(1800);
      equationEl.textContent = 'one → another → the others';
      equationEl.classList.add('show');
      await wait(1900);

      titleEl.textContent = '先看總數，再看是不是「剩下全部」';
      leadEl.textContent = 'the = 已知範圍內剩下的全部';
      playButton.disabled = false;
      playButton.textContent = '再播一次';
      lesson.classList.remove('playing');
      playing = false;
    }

    playButton.addEventListener('click', play);
    soundButton.addEventListener('click', () => {
      soundOn = !soundOn;
      soundButton.textContent = `聲音：${soundOn ? '開' : '關'}`;
      soundButton.setAttribute('aria-pressed', String(soundOn));
      if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
    });
  </script>
</body>
</html>
